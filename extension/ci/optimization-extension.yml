name: Optimization extension deterministic tests
"on":
  push:
    paths:
      - 'extension/**'
      - '.github/workflows/optimization-extension.yml'
  pull_request:
    paths:
      - 'extension/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record environment
        run: |
          python --version
          python -VV
          git rev-parse HEAD
      - name: Compile extension sources
        run: python -m compileall -q extension/src extension/tests
      - name: Run accumulated E09-E12 tests
        run: python -m unittest discover -s extension/tests -p 'test_*.py' -v
      - name: Validate experiment manifest
        run: python extension/experiments/validate_manifest.py
